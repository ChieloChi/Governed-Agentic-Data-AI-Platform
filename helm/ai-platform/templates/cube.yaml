          value: {{ .Values.externalDatabase.type | default "postgres" | quote }}
          {{- else }}
          value: "postgres"
          {{- end }}
        {{- if and .Values.externalDatabase.enabled (or (eq .Values.externalDatabase.type "athena") (eq .Values.externalDatabase.type "aws_athena")) }}
        - name: CUBEJS_DB_ATHENA_REGION
          value: {{ .Values.externalDatabase.athena.region | quote }}
        - name: CUBEJS_DB_ATHENA_WORKGROUP
          value: {{ .Values.externalDatabase.athena.workgroup | quote }}
        - name: CUBEJS_DB_ATHENA_S3_OUTPUT_LOCATION
          value: {{ .Values.externalDatabase.athena.s3OutputLocation | quote }}
        {{- else }}
        - name: CUBEJS_DB_HOST
          {{- if .Values.externalDatabase.enabled }}
          value: {{ .Values.externalDatabase.host | quote }}
          {{- else }}
          value: "postgres-service"
          {{- end }}
        - name: CUBEJS_DB_PORT
          {{- if .Values.externalDatabase.enabled }}
          value: {{ .Values.externalDatabase.port | quote }}
          {{- else }}
          value: "{{ .Values.postgres.port }}"
          {{- end }}
        - name: CUBEJS_DB_NAME
          {{- if .Values.externalDatabase.enabled }}
          value: {{ .Values.externalDatabase.dbName | quote }}
          {{- else }}
          value: {{ .Values.postgres.dbName | quote }}
          {{- end }}
        - name: CUBEJS_DB_USER
          {{- if .Values.externalDatabase.enabled }}
          value: {{ .Values.externalDatabase.dbUser | quote }}
          {{- else }}
          value: {{ .Values.postgres.dbUser | quote }}
          {{- end }}
        - name: CUBEJS_DB_PASS
          valueFrom:
            secretKeyRef:
              name: platform-secrets
              key: postgres-password
        {{- end }}
        - name: CUBEJS_API_SECRET
          valueFrom:
            secretKeyRef:
              name: platform-secrets
              key: cube-api-secret
        - name: CUBEJS_DEV_MODE
          value: "{{ .Values.cube.devMode }}"
        {{- if .Values.cubeStore.enabled }}
        - name: CUBEJS_CUBESTORE_HOST
          value: "{{ .Release.Name }}-cubestore-router:{{ .Values.cubeStore.router.port | default 9999 }}"
        - name: CUBEJS_DB_EXPORT_BUCKET
          {{- if .Values.objectStorage.s3.enabled }}
          value: {{ .Values.cubeStore.s3.bucket | default .Values.objectStorage.s3.bucket | quote }}
          {{- else if .Values.objectStorage.minio.enabled }}
          value: {{ .Values.cubeStore.minio.bucket | default .Values.objectStorage.minio.defaultBucket | quote }}
          {{- else }}
          value: "cubestore-export"
          {{- end }}
        {{- end }}
        {{- with .Values.cube.extraEnv }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
        {{- with .Values.externalDatabase.extraEnv }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
        startupProbe:
          httpGet:
            path: /readyz
            port: {{ .Values.cube.apiPort }}
          initialDelaySeconds: 5
          periodSeconds: 5
          failureThreshold: 20
        livenessProbe:
          httpGet:
            path: /livez
            port: {{ .Values.cube.apiPort }}
          initialDelaySeconds: 15
          periodSeconds: 20
          timeoutSeconds: 3
        volumeMounts:
        - name: schema-volume
          mountPath: /cube/conf/schema
          readOnly: true
        resources:
          {{- toYaml .Values.cube.worker.resources | nindent 10 }}
      volumes:
      - name: schema-volume
        configMap:
          name: {{ .Release.Name }}-cube-schema
{{- end }}
{{- end }}
