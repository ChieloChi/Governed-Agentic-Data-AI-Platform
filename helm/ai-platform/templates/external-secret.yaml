{{- if or .Values.secretsManager.aws.enabled .Values.secretsManager.vault.enabled }}
apiVersion: external-secrets.io/v1beta1
kind: ClusterSecretStore
metadata:
  name: platform-secret-store
spec:
  provider:
    {{- if .Values.secretsManager.aws.enabled }}
    aws:
      service: SecretsManager
      region: {{ .Values.secretsManager.aws.region }}
      auth:
        jwt:
          serviceAccountRef:
            name: {{ .Values.secretsManager.aws.serviceAccountName }}
            namespace: external-secrets
    {{- else if .Values.secretsManager.vault.enabled }}
    vault:
      server: {{ .Values.secretsManager.vault.server }}
      path: {{ .Values.secretsManager.vault.path }}
      version: "v2"
      auth:
        kubernetes:
          mountPath: {{ .Values.secretsManager.vault.mountPath }}
          role: {{ .Values.secretsManager.vault.role }}
    {{- end }}
---
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: platform-external-secrets
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: platform-secret-store
    kind: ClusterSecretStore
  target:
    name: platform-secrets
    creationPolicy: Owner
  data:
    {{- if .Values.secretsManager.aws.enabled }}
    - secretKey: litellm-master-key
      remoteRef:
        key: {{ .Values.secretsManager.aws.secretKey }}
        property: litellm_master_key
    - secretKey: postgres-password
      remoteRef:
        key: {{ .Values.secretsManager.aws.secretKey }}
        property: postgres_password
    - secretKey: cube-api-secret
      remoteRef:
        key: {{ .Values.secretsManager.aws.secretKey }}
        property: cube_api_secret
    {{- else if .Values.secretsManager.vault.enabled }}
    - secretKey: litellm-master-key
      remoteRef:
        key: {{ .Values.secretsManager.vault.secretPath }}
        property: litellm_master_key
    - secretKey: postgres-password
      remoteRef:
        key: {{ .Values.secretsManager.vault.secretPath }}
        property: postgres_password
    - secretKey: cube-api-secret
      remoteRef:
        key: {{ .Values.secretsManager.vault.secretPath }}
        property: cube_api_secret
    {{- end }}
{{- end }}
