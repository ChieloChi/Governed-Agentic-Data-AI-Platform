{{- if .Values.vllm.enabled }}
{{- if .Values.vllm.persistence.enabled }}
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ .Release.Name }}-vllm-models-pvc
  labels:
    app: vllm-inference
spec:
  accessModes:
    - {{ .Values.vllm.persistence.accessMode | default "ReadWriteOnce" }}
  resources:
    requests:
      storage: {{ .Values.vllm.persistence.size | default "20Gi" }}
  {{- if .Values.vllm.persistence.storageClass }}
  storageClassName: {{ .Values.vllm.persistence.storageClass | quote }}
  {{- end }}
---
{{- end }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-vllm
  labels:
    app: vllm-inference
spec:
  replicas: {{ .Values.vllm.replicaCount | default 1 }}
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: vllm-inference
  template:
    metadata:
      labels:
        app: vllm-inference
    spec:
      {{- if .Values.vllm.podSecurityContext }}
      securityContext:
        {{- toYaml .Values.vllm.podSecurityContext | nindent 8 }}
      {{- end }}
      tolerations:
      - key: {{ .Values.vllm.gpuToleration }}
        operator: "Equal"
        value: "true"
        effect: "NoSchedule"
      nodeSelector:
        {{- toYaml .Values.vllm.nodeSelector | nindent 8 }}
      containers:
      - name: vllm
        image: {{ .Values.vllm.image }}
        {{- if .Values.vllm.securityContext }}
        securityContext:
          {{- toYaml .Values.vllm.securityContext | nindent 10 }}
        {{- end }}
        args:
          - "--model"
          - {{ .Values.vllm.model }}
          - "--port"
          - "{{ .Values.vllm.port }}"
          - "--dtype"
          - {{ .Values.vllm.dtype }}
          - "--gpu-memory-utilization"
          - "{{ .Values.vllm.gpuMemoryUtilization }}"
          - "--max-model-len"
          - "{{ .Values.vllm.maxModelLen }}"
        ports:
        - containerPort: {{ .Values.vllm.port }}
          name: http
        resources:
          {{- toYaml .Values.vllm.resources | nindent 10 }}
        startupProbe:
          httpGet:
            path: /health
            port: {{ .Values.vllm.port }}
          initialDelaySeconds: 30
          periodSeconds: 10
          failureThreshold: 30
        readinessProbe:
          httpGet:
            path: /health
            port: {{ .Values.vllm.port }}
          initialDelaySeconds: 10
          periodSeconds: 10
          timeoutSeconds: 5
        livenessProbe:
          httpGet:
            path: /health
            port: {{ .Values.vllm.port }}
          initialDelaySeconds: 15
          periodSeconds: 20
          timeoutSeconds: 5
        volumeMounts:
        - name: hf-cache
          mountPath: /root/.cache/huggingface
        - name: tmp-volume
          mountPath: /tmp
      volumes:
      - name: hf-cache
        {{- if .Values.vllm.persistence.enabled }}
        persistentVolumeClaim:
          claimName: {{ .Release.Name }}-vllm-models-pvc
        {{- else }}
        emptyDir: {}
        {{- end }}
      - name: tmp-volume
        emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: vllm-service
spec:
  selector:
    app: vllm-inference
  ports:
  - port: {{ .Values.vllm.port }}
    targetPort: {{ .Values.vllm.port }}
    name: http
{{- end }}
