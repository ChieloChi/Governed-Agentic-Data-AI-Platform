# Global & Infrastructure Configuration
global:
  environment: "production"
  clusterName: "ai-infra-platform"

# 1. Cloud-Agnostic Secrets Management (Toggle between AWS Secrets Manager and HashiCorp Vault)
secretsManager:
  aws:
    enabled: true # Set to true when running on AWS EKS
    region: "us-east-1"
    secretKey: "ai-infra-eks/platform-credentials"
    serviceAccountName: "external-secrets-sa"

  vault:
    enabled: false # Set to true when running on Bare-Metal / On-Premise
    server: "http://vault.vault.svc.cluster.local:8200"
    path: "secret"
    mountPath: "kubernetes"
    role: "ai-platform-role"
    secretPath: "ai-platform/credentials"

# 2. Identity & Access Management (Keycloak / SSO for Bare-Metal & Multi-Tenancy)
keycloak:
  enabled: false # Set to true for Bare-Metal on-prem OIDC / SSO identity provider
  image: "quay.io/keycloak/keycloak:24.0"
  port: 8080
  realm: "ai-enterprise"

# 3. Analytics Datastore (Choose: In-Cluster Self-Managed OR External Managed Database)
postgres:
  enabled: true # Set to true to deploy PostgreSQL inside the cluster
  image: "postgres:16-alpine"
  dbName: "enterprise_analytics"
  dbUser: "cube_admin"
  port: 5432
  resources:
    requests:
      cpu: "100m"
      memory: "256Mi"
    limits:
      cpu: "500m"
      memory: "1Gi"

externalDatabase:
  enabled: false
  host: "rds-analytics.xyz.us-east-1.rds.amazonaws.com"
  port: 5432
  dbName: "enterprise_analytics"
  dbUser: "cube_admin"

# 4. Cube.js Semantic Engine
cube:
  enabled: true
  image: "cubejs/cube:v0.36.0"
  replicaCount: 1
  apiPort: 4000
  sqlPort: 15432
  devMode: "true"
  resources:
    requests:
      cpu: "250m"
      memory: "512Mi"
    limits:
      cpu: "1000m"
      memory: "1.5Gi"
  autoscaling:
    enabled: true
    minReplicas: 1
    maxReplicas: 5
    targetCPUUtilizationPercentage: 75
    targetMemoryUtilizationPercentage: 80
  pdb:
    enabled: true
    minAvailable: 1

# 5. vLLM GPU Serving Engine
vllm:
  enabled: true
  image: "vllm/vllm-openai:v0.6.3"
  replicaCount: 1
  model: "Qwen/Qwen2.5-0.5B-Instruct"
  port: 8000
  dtype: "half"
  gpuMemoryUtilization: 0.85
  maxModelLen: 4096
  gpuToleration: "nvidia.com/gpu"
  nodeSelector:
    role: "gpu-inference"
  resources:
    requests:
      nvidia.com/gpu: "1"
      cpu: "1500m"
      memory: "6Gi"
    limits:
      nvidia.com/gpu: "1"
      cpu: "3000m"
      memory: "10Gi"
  autoscaling:
    enabled: false # Enabled when Karpenter/cluster-autoscaler provisions multi-GPU nodes
    minReplicas: 1
    maxReplicas: 3
    targetCPUUtilizationPercentage: 80
  pdb:
    enabled: true
    minAvailable: 1

# 6. LiteLLM AI Gateway
litellm:
  enabled: true
  image: "ghcr.io/berriai/litellm:main-v1.44.20"
  replicaCount: 1
  port: 4000
  resources:
    requests:
      cpu: "200m"
      memory: "256Mi"
    limits:
      cpu: "500m"
      memory: "1Gi"
  autoscaling:
    enabled: true
    minReplicas: 1
    maxReplicas: 8
    targetCPUUtilizationPercentage: 70
    targetMemoryUtilizationPercentage: 75
  pdb:
    enabled: true
    minAvailable: 1

# 7. Redis Semantic Prompt Cache
redis:
  enabled: true
  image: "redis:7-alpine"
  port: 6379
  resources:
    requests:
      cpu: "100m"
      memory: "256Mi"
    limits:
      cpu: "250m"
      memory: "512Mi"

# 8. Qdrant Vector Database
qdrant:
  enabled: true
  image: "qdrant/qdrant:v1.11.0"
  httpPort: 6333
  grpcPort: 6334
  resources:
    requests:
      cpu: "250m"
      memory: "512Mi"
    limits:
      cpu: "1000m"
      memory: "1.5Gi"
